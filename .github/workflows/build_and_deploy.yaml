on:
  push:
    branches:
     - main

name: quarto

permissions:
  contents: write
  pages: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./book/
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_PATHS_ROOT: ~/.local/share/renv
    steps:
      - uses: actions/checkout@v7

      - name: Install system-wide dependencies
        run: sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libv8-dev build-essential fonts-liberation libgdal-dev cmake pkg-config libudunits2-dev libmkl-rt libfontconfig1-dev libnode-dev libsodium-dev libglpk-dev pandoc

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.25

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          r-version: 4.6.0

      - uses: r-lib/actions/setup-renv@v2
        with:
          working-directory: book

      - name: Render book
        run: quarto render .

      - name: Render slides
        run: quarto render . --profile=slides

      - name: Merge slides into book
        run: bash ./merge.sh

      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          render: false
          target: gh-pages
          path: book
          output-dir: book/_book
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

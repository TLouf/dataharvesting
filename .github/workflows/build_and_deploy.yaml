on:
  push:
    branches:
     - main

name: quarto

permissions:
  contents: write
  pages: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./book/
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_PATHS_ROOT: ~/.local/share/renv
    steps:
      - uses: actions/checkout@v7

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.5.8

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          r-version: 4.6.0

      - name: Install system-wide depencies
        run: sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libv8-dev build-essential fonts-liberation libgdal-dev cmake pkg-config libudunits2-dev libmkl-rt libfontconfig1-dev libnode-dev libsodium-dev

      - name: Cache packages renv
        uses: actions/cache@v4
        with:
          path: ${{ env.RENV_PATHS_ROOT }}
          key: ${{ runner.os }}-renv-${{ hashFiles('**/renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-renv-

      - name: Restore packages renv
        shell: Rscript {0}
        run: |
          if (!requireNamespace("renv", quietly = TRUE)) install.packages("renv")
          renv::restore()

      - name: Render book
        uses: quarto-dev/quarto-actions/render@v2

      - name: Render slides
        run: quarto render . --profile=slides

      - name: Merge slides into book
        run: bash ./merge.sh

      - name: Deploy to GitHub Pages 🚀
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          source-dir: _book
          token: ${{ secrets.GITHUB_TOKEN }}
